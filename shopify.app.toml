# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "1ddc9c4da0f5e090d0824dacc0431aaa"
application_url = "https://example.com"
embedded = true
name = "MyDukaan"

[access_scopes]
# Shopify requires write_app_proxy for any app with an app proxy (the CLI's dev preview rejects it
# otherwise). S1, S2 and S4: shop timezone, metafield writes and the resource picker need none.
scopes = "write_app_proxy"
optional_scopes = [ ]
use_legacy_install_flow = false

[webhooks]
api_version = "2026-10"

[auth]
redirect_urls = [ ]

[app_proxy]
url = "https://example.com/proxy"
subpath = "countdown"
prefix = "apps"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
